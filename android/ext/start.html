<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Start</title>
<link rel="stylesheet" href="page.css">
<style>
body { padding: 18px 16px 40px; font-family: ui-monospace, "DejaVu Sans Mono", "Noto Sans Mono", monospace; }
main { max-width: 760px; margin: 0 auto; }
pre { margin: 0; line-height: 1.1; white-space: pre; }
.two .s { color: color-mix(in srgb, var(--accent) 50%, var(--base)); }
.two .f { color: var(--accent); }
.banner { text-align: center; overflow: hidden; margin: 6px 0 16px; }
.banner pre { display: inline-block; text-align: left; line-height: 1; }
.art { text-align: center; overflow: hidden; margin-bottom: 14px; }
.art pre { display: inline-block; text-align: left; font-size: 9px; }
.art .ln { display: inline-block; }
.animate .art .ln { animation: sway 5s ease-in-out infinite; }
@keyframes sway { 0%, 100% { transform: translateX(-1.5px); } 50% { transform: translateX(1.5px); } }
@media (prefers-reduced-motion: reduce) { .animate .art .ln { animation: none; } }
.clock { font-size: 44px; font-weight: 700; color: var(--accent); text-align: center; letter-spacing: 2px; }
.date { color: var(--subtext); text-align: center; margin-bottom: 16px; }
form { display: flex; gap: 8px; margin-bottom: 20px; }
form input { flex: 1; min-width: 0; font: inherit; color: var(--text); background: var(--surface);
  border: 1px solid var(--surface2); border-radius: var(--r); padding: 12px 14px; }
form input:focus { outline: none; border-color: var(--accent); background: var(--crust); }
.groups { display: grid; grid-template-columns: repeat(auto-fill, minmax(150px, 1fr)); gap: 10px; }
.group { background: var(--mantle); border: 1px solid var(--surface2); border-radius: var(--r); padding: 10px 12px; }
.group h2 { margin: 0 0 6px; font-size: 12px; letter-spacing: 2px; }
.group a { display: block; color: var(--text); text-decoration: none; padding: 7px 4px; border-radius: var(--r);
  white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.group a:active, .group a:focus-visible { background: var(--accent); color: var(--on-accent); outline: none; }
footer { margin-top: 24px; text-align: center; font-size: 13px; }
footer a { color: var(--overlay); }
/* styles */
.wired h2::before { content: "["; } .wired h2::after { content: "]"; }
.wired .group a::before { content: "> "; color: var(--overlay); }
.wired body::after { content: ""; position: fixed; inset: 0; pointer-events: none;
  background: repeating-linear-gradient(to bottom, transparent 0 2px, rgba(0,0,0,.16) 2px 3px); }
.classic .group, .classic form input { border: 2px solid; border-radius: 0;
  border-color: var(--crust) color-mix(in srgb, var(--surface) 50%, var(--text)) color-mix(in srgb, var(--surface) 50%, var(--text)) var(--crust); }
.classic button { border: 2px solid; border-radius: 0; background: color-mix(in srgb, var(--surface) 88%, var(--text)); color: var(--text);
  border-color: color-mix(in srgb, var(--surface) 50%, var(--text)) var(--crust) var(--crust) color-mix(in srgb, var(--surface) 50%, var(--text)); }
.minimal .group { background: none; border: none; padding: 4px 0; }
.minimal form input { background: none; border-width: 0 0 1px; border-radius: 0; }
</style>
</head>
<body>
<main>
  <div class="banner two" id="banner"></div>
  <div class="art two" id="art"></div>
  <div class="clock" id="clock"></div>
  <div class="date" id="date"></div>
  <form id="form" autocomplete="off">
    <input id="q" type="search" placeholder="Search or type an address" enterkeyhint="search" autocapitalize="off">
    <button class="primary">Go</button>
  </form>
  <div class="groups" id="groups"></div>
  <footer><a href="options.html">wolfforge settings</a></footer>
</main>
<script src="common.js"></script>
<script src="start.js"></script>
</body>
</html>
